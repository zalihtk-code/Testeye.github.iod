<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f7;--card:#fff;--line:#e3e3e6;--tx:#17171a;--mu:#6b6b75;--ac:#1c1c20;--acx:#fff;--ok:#12a36a;--soft:#efeff1}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0e;--card:#141417;--line:#26262b;--tx:#f2f2f4;--mu:#8e8e98;--ac:#d4d4d8;--acx:#111;--ok:#2ed08f;--soft:#1d1d21}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-weight:700}
header b{flex:1;font-size:18px}header span{color:var(--mu);font-size:14px}
.ticker{background:var(--card);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;font-size:14px;color:var(--mu);padding:10px 0}
.ticker span{display:inline-block;padding-left:100%;animation:mq 20s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:16px}}
main{padding:16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px}p{color:var(--mu);margin:6px 0 12px;line-height:1.6}
.btns{display:flex;gap:10px}.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-weight:500;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.s{flex:none;padding:8px 12px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.stats .card{margin:0;padding:14px}.stats small{color:var(--mu)}.stats strong{display:block;font-size:26px;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px}.row>div{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.ok{color:var(--ok)}.back{background:none;border:0;color:var(--mu);font:inherit;padding:8px 0;cursor:pointer}
.cat{cursor:pointer;padding:12px}.cat .img{height:120px;border-radius:12px;background:var(--soft) center/cover;display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:10px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--soft);padding:10px;border-radius:10px;margin:8px 0 0;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav a{flex:1;text-align:center;color:var(--mu);text-decoration:none;font-size:12px;padding:6px 0;border-radius:10px}nav a i{display:block;font-style:normal;font-size:20px}nav a.on{background:var(--soft);color:var(--tx)}

:root[data-theme=light]{--bg:#f6f6f7;--card:#fff;--line:#e3e3e6;--tx:#17171a;--mu:#6b6b75;--ac:#1c1c20;--acx:#fff;--ok:#12a36a;--soft:#efeff1}
:root[data-theme=dark]{--bg:#0c0c0e;--card:#141417;--line:#26262b;--tx:#f2f2f4;--mu:#8e8e98;--ac:#d4d4d8;--acx:#111;--ok:#2ed08f;--soft:#1d1d21}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.pc{margin:0;padding:12px}.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--mu);font-size:13px}.pc b{display:block;margin:8px 0 2px;font-size:15px}.pc small{display:block}

:root{--g:linear-gradient(135deg,#7c3aed,#ec4899)}
body{background:radial-gradient(900px 480px at 50% -140px,rgba(124,58,237,.25),transparent),var(--bg);background-attachment:fixed}
header{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.logo{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.45)}
.card{box-shadow:0 10px 26px -14px rgba(0,0,0,.4);transition:transform .15s,border-color .15s}
.card.pc:hover,.cat:hover{transform:translateY(-2px);border-color:#7c3aed}
.btn.p{background:var(--g);border:0;color:#fff;box-shadow:0 8px 20px -8px rgba(124,58,237,.8)}.btn.p:active{transform:scale(.98)}.btn.p:disabled{opacity:.4;box-shadow:none}
h1{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav a.on{background:var(--g);color:#fff}
.hero{background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(236,72,153,.12)),var(--card);border-color:rgba(124,58,237,.4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.chips span{background:var(--soft);padding:6px 10px;border-radius:99px;font-size:13px;color:var(--mu)}.chips a{background:var(--g);color:#fff;padding:6px 10px;border-radius:99px;font-size:13px;text-decoration:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--card);color:var(--tx);border:1px solid var(--line);padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.4)}#toast.on{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}#modal.on{display:flex}#modal>div{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s}@keyframes up{from{transform:translateY(40px);opacity:0}}
</style></head><body>
<header><div class="logo">M</div><b>MY STORE</b><span id="bal"></span></header>
<div class="ticker"><span id="ann"></span></div>
<main id="app"></main>
<div id="toast"></div><div id="modal" onclick="if(event.target===this)closeModal()"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n).toLocaleString('th-TH'),dt=t=>new Date(t).toLocaleString('th-TH');
let me=null;
async function api(u,body){const r=await fetch('/api'+u,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');return j}
const need=()=>me?'':'<div class="card"><p>กรุณาเข้าสู่ระบบก่อน</p><a class="btn p" style="display:block;text-align:center;text-decoration:none" href="#menu">เข้าสู่ระบบ / สมัครสมาชิก</a></div>';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(h){$('#modal').innerHTML='<div>'+h+'</div>';$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
const pcard=p=>`<div class="card pc">${p.img&&/^https?:\/\//.test(p.img)?`<img src="${encodeURI(p.img)}" alt="" loading="lazy">`:'<div class="ph">ไม่มีรูป</div>'}<b>${e(p.name)}</b><small style="color:var(--mu)">${e(p.descr)}</small><div style="margin:6px 0"><b>${baht(p.price)}</b><small style="color:var(--mu)">คงเหลือ ${p.qty} | ขายแล้ว ${p.sold}</small></div><button class="btn p" style="width:100%" data-act="buy" data-id="${p.id}" data-n="${e(p.name)}" data-pr="${p.price}" ${p.qty>0?'':'disabled'}>${p.qty>0?'ซื้อสินค้า':'สินค้าหมด'}</button></div>`;
const V={
async home(){const s=await api('/stats');$('#ann').textContent=s.announcement||'ยินดีต้อนรับ';
 return `<div class="card hero"><h1>ยินดีต้อนรับสู่ MY STORE</h1><p>ร้านจำหน่ายสินค้าดิจิทัล ราคาถูก ปลอดภัย</p><div class="chips"><span>⭐ สินค้าคุณภาพ</span><span>🛡️ ปลอดภัย</span><span>🎧 ซัพพอร์ต</span>${/^https?:\/\//.test(s.contact||'')?`<a href="${encodeURI(s.contact)}" target="_blank" rel="noopener">💬 ติดต่อร้าน</a>`:''}</div><div class="btns"><a class="btn p" style="text-align:center;text-decoration:none" href="#products">เลือกดูสินค้า</a><a class="btn" style="text-align:center;text-decoration:none" href="#topup">เติมเงิน</a></div></div>
 <div class="stats"><div class="card"><small>สมาชิกทั้งหมด</small><strong>${s.members}</strong></div><div class="card"><small>รายการสินค้า</small><strong>${s.products}</strong></div><div class="card"><small>สินค้าพร้อมส่ง</small><strong>${s.inStock}</strong></div><div class="card"><small>ขายแล้ว</small><strong>${s.sold}</strong></div></div>
 <div class="card"><h2>เติมสต็อกล่าสุด <span class="ok" style="font-size:13px">● UPDATE</span></h2>${s.latest.map(l=>`<div class="row"><div><b>${e(l.name)}</b><small>${dt(l.t)}</small></div></div>`).join('')||'<p>ยังไม่มีสินค้า</p>'}</div>
 <div class="card"><h2>ซื้อล่าสุด</h2>${s.recent.map(r=>`<div class="row"><div><b>${e(r.u)} ซื้อ ${e(r.pname)}</b><small>${dt(r.created)}</small></div></div>`).join('')||'<p>ยังไม่มีรายการ</p>'}</div>
 <h2>สินค้าทั่วไป</h2><div class="grid">${(await api('/products')).map(pcard).join('')}</div>`},
async products(a){
 if(a){const[cats,ps]=await Promise.all([api('/categories'),api('/products?cat='+encodeURIComponent(a))]);const c=cats.find(x=>x.id==a)||{};
  return `<a class="back" href="#products">← กลับ</a><h1>${e(c.name)}</h1>`+(ps.length?'<div class="grid">'+ps.map(pcard).join('')+'</div>':'<p>ยังไม่มีสินค้าในหมวดนี้</p>')}
 const cats=await api('/categories');
 return `<h1>เลือกหมวดหมู่สินค้า</h1><input id="q" placeholder="ค้นหาหมวดหมู่..." oninput="document.querySelectorAll('.cat').forEach(c=>c.style.display=c.dataset.n.includes(this.value.toLowerCase())?'':'none')">`+cats.map(c=>`<div class="card cat" data-n="${e(c.name.toLowerCase())}" onclick="location.hash='products/${c.id}'"><div class="img" ${c.img&&/^https?:\/\//.test(c.img)?`style="background-image:url('${encodeURI(c.img)}')"`:''}>${c.img?'':e(c.name)}</div><b>${e(c.name)}</b><br><small style="color:var(--mu)">${c.n} สินค้าในหมวดหมู่นี้</small></div>`).join('')||'<p>ยังไม่มีหมวดหมู่</p>'},
async topup(){if(!me)return need();const[s,t]=await Promise.all([api('/stats'),api('/topups')]);
 return `<div class="card"><h2>เติมเงิน</h2><p style="white-space:pre-line">${e(s.payinfo||'ติดต่อแอดมินเพื่อรับช่องทางชำระเงิน')}</p><form data-h="topup"><input name="amount" type="number" min="1" placeholder="จำนวนเงิน (บาท)" required><input name="ref" placeholder="เลขอ้างอิง / ชื่อผู้โอน" required><button class="btn p" style="width:100%">แจ้งโอนเงิน</button></form></div>
 <div class="card"><h2>ใช้โค้ดเติมเงิน</h2><form data-h="redeem"><input name="code" placeholder="กรอกโค้ด" required><button class="btn p" style="width:100%">ใช้โค้ด</button></form></div>
 <div class="card"><h2>ประวัติการเติมเงิน</h2>${t.map(x=>`<div class="row"><div><b>${baht(x.amount)}</b><small>${e(x.ref)} • ${dt(x.created)}</small></div><span class="${x.status=='approved'?'ok':''}">${{pending:'รอตรวจสอบ',approved:'สำเร็จ',rejected:'ไม่อนุมัติ'}[x.status]}</span></div>`).join('')||'<p>ยังไม่มีรายการ</p>'}</div>`},
async orders(){if(!me)return need();const o=await api('/orders');
 return '<h1>คำสั่งซื้อ</h1>'+(o.map(x=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${e(x.pname)}</b><span>${baht(x.price)}</span></div><small style="color:var(--mu)">${dt(x.created)}</small><pre>${e(x.content)}</pre></div>`).join('')||'<p>ยังไม่มีคำสั่งซื้อ</p>')},
async menu(){if(me)return `<div class="card"><h2>${e(me.username)}</h2><p>ยอดคงเหลือ ${baht(me.balance)}</p>${me.role=='admin'?'<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="#admin">หลังบ้านแอดมิน</a>':''}<button class="btn" style="margin-bottom:10px" data-act="theme">สลับโหมดสว่าง/มืด</button><button class="btn" data-act="logout">ออกจากระบบ</button></div>`;
 return `<div class="card"><h2>เข้าสู่ระบบ</h2><form data-h="login"><input name="username" placeholder="ชื่อผู้ใช้" autocomplete="username" required><input name="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required><button class="btn p" style="width:100%">เข้าสู่ระบบ</button></form></div>
 <div class="card"><h2>สมัครสมาชิก</h2><form data-h="register"><input name="username" placeholder="ชื่อผู้ใช้ (a-z, 0-9, _)" autocomplete="username" required><input name="password" type="password" placeholder="รหัสผ่าน อย่างน้อย 8 ตัว" autocomplete="new-password" required><button class="btn p" style="width:100%">สมัครสมาชิก</button></form></div>`},
async admin(){if(!me||me.role!='admin')return '<p>ไม่มีสิทธิ์เข้าถึง</p>';const d=await api('/admin/data');
 const opt=d.products.map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('');
 return `<h1>หลังบ้านแอดมิน</h1>
 <div class="card"><h2>รอตรวจสอบการเติมเงิน (${d.topups.length})</h2>${d.topups.map(t=>`<div class="row"><div><b>${e(t.username)} • ${baht(t.amount)}</b><small>${e(t.ref)} • ${dt(t.created)}</small></div><button class="btn p s" data-act="tu" data-id="${t.id}" data-a="approve">อนุมัติ</button><button class="btn s" data-act="tu" data-id="${t.id}" data-a="reject">ปฏิเสธ</button></div>`).join('')||'<p>ไม่มีรายการ</p>'}</div>
 <div class="card"><h2>ประกาศ / ช่องทางชำระเงิน</h2><form data-h="setting"><input name="announcement" value="${e(d.announcement)}" placeholder="ข้อความประกาศ"><input name="contact" value="${e(d.contact)}" placeholder="ลิงก์ติดต่อร้าน (LINE/Telegram https://...)"><textarea name="payinfo" rows="3" placeholder="ข้อมูลช่องทางโอนเงิน">${e(d.payinfo)}</textarea><button class="btn p" style="width:100%">บันทึก</button></form></div>
 <div class="card"><h2>เพิ่มหมวดหมู่</h2><form data-h="cat"><input name="name" placeholder="ชื่อหมวดหมู่" required><input name="img" placeholder="ลิงก์รูปแบนเนอร์ (https://...) ไม่บังคับ"><button class="btn p" style="width:100%">เพิ่ม</button></form></div>
 <div class="card"><h2>เพิ่มสินค้า</h2><form data-h="prod"><select name="cat_id" required><option value="">เลือกหมวดหมู่</option>${d.categories.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('')}</select><input name="name" placeholder="ชื่อสินค้า" required><input name="price" type="number" min="0" placeholder="ราคา (บาท)" required><input name="img" placeholder="ลิงก์รูปสินค้า (https://...)"><textarea name="descr" rows="2" placeholder="รายละเอียด"></textarea><button class="btn p" style="width:100%">เพิ่ม</button></form></div>
 <div class="card"><h2>สร้างโค้ดเติมเงิน</h2><form data-h="code"><input name="amount" type="number" min="1" placeholder="มูลค่าต่อโค้ด (บาท)" required><input name="count" type="number" min="1" max="50" value="1"><button class="btn p" style="width:100%">สร้างโค้ด</button></form><pre>${d.codes.map(c=>e(c.code)+' = ฿'+c.amount).join('\n')||'ยังไม่มีโค้ดที่ยังไม่ถูกใช้'}</pre></div>
 <div class="card"><h2>เติมสต็อก</h2><form data-h="stock"><select name="product_id" required><option value="">เลือกสินค้า</option>${opt}</select><textarea name="lines" rows="5" placeholder="1 บรรทัด = 1 ชิ้น (เช่น คีย์/ไอดี:รหัส)" required></textarea><button class="btn p" style="width:100%">เพิ่มสต็อก</button></form></div>
 <div class="card"><h2>สินค้า</h2>${d.products.map(p=>`<div class="row"><div><b>${e(p.name)}</b><small>${e(p.cat)} • ${baht(p.price)} • สต็อก ${p.qty}</small></div><button class="btn s" data-act="tog" data-id="${p.id}">${p.active?'ซ่อน':'แสดง'}</button></div>`).join('')}</div>
 <div class="card"><h2>สมาชิก</h2>${d.users.map(u=>`<div class="row"><div><b>${e(u.username)}</b><small>${baht(u.balance)}</small></div><button class="btn s" data-act="bal" data-id="${u.id}">ปรับยอด</button></div>`).join('')}</div>`}
};
const H={
 async redeem(d){const r=await api('/redeem',d);await boot();toast('เติมเงิน ฿'+r.amount+' สำเร็จ');route()},
 async code(d){const r=await api('/admin/code',d);alert(r.codes.join('\n'));route()},
 async login(d){await api('/login',d);await boot();location.hash='home'},
 async register(d){await api('/register',d);await boot();location.hash='home'},
 async topup(d){await api('/topup',d);toast('แจ้งโอนแล้ว รอแอดมินตรวจสอบ');route()},
 async setting(d){await api('/admin/setting',d);toast('บันทึกแล้ว')},
 async cat(d){await api('/admin/category',d);route()},
 async prod(d){await api('/admin/product',d);route()},
 async stock(d){const r=await api('/admin/stock',d);toast('เพิ่ม '+r.added+' ชิ้น');route()}
};
const A={
 theme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(x){}},
 async logout(){await api('/logout',{});me=null;await boot();location.hash='home'},
 async buy(x){if(!me){toast('กรุณาเข้าสู่ระบบก่อน');location.hash='menu';return}modal(`<h2>ยืนยันการซื้อ</h2><p>${e(x.n)}</p><p>ราคา <b>${baht(x.pr)}</b> • ยอดคงเหลือ ${baht(me.balance)}</p><div class="btns"><button class="btn" data-act="close">ยกเลิก</button><button class="btn p" data-act="buy2" data-id="${x.id}">ยืนยัน</button></div>`)},
 async buy2(x){const r=await api('/buy',{id:x.id});await boot();modal(`<h2 class="ok">ซื้อสำเร็จ 🎉</h2><p>เก็บข้อมูลนี้ไว้ (ดูซ้ำได้ที่หน้าคำสั่งซื้อ)</p><pre>${e(r.content)}</pre><div class="btns" style="margin-top:14px"><button class="btn" data-act="copy" data-t="${e(r.content)}">คัดลอก</button><button class="btn p" data-act="close">ปิด</button></div>`);route()},
 close(){closeModal()},
 copy(x){navigator.clipboard.writeText(x.t).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้'))},
 async tu(x){await api('/admin/topup',{id:x.id,action:x.a});route()},
 async tog(x){await api('/admin/product/toggle',{id:x.id});route()},
